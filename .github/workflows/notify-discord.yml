name: Discord Notification

on:
  workflow_call:
    inputs:
      status:
        description: 'Build status (success / failure / cancelled)'
        required: true
        type: string
      version:
        description: 'Build version'
        required: true
        type: string
      workflow-name:
        description: 'Workflow name'
        required: true
        type: string
      job-name:
        description: 'Job name that triggered notification'
        required: false
        type: string
        default: 'Build'
      installer-artifact-name:
        description: 'インストーラーアーティファクト名 (省略可)'
        required: false
        type: string
        default: ''
      windows-artifact-name:
        description: 'Windows ビルドアーティファクト名 (省略可)'
        required: false
        type: string
        default: ''
      webgl-artifact-name:
        description: 'WebGL ビルドアーティファクト名 (省略可)'
        required: false
        type: string
        default: ''
      pages-url:
        description: 'デプロイされた GitHub Pages の URL (省略可)'
        required: false
        type: string
        default: ''
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    # artifact ID 取得のために読み取り権限が必要
    permissions:
      actions: read

    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check Webhook Availability
        id: check
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "DISCORD_WEBHOOK_URL が未設定のため通知をスキップします"
          fi

      - name: Resolve Artifact URLs
        id: artifacts
        if: steps.check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub API でこの run のアーティファクト一覧を取得
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100"
          ARTIFACT_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL")

          # アーティファクト名から ID を引く
          get_id() {
            local name="$1"
            echo "$ARTIFACT_JSON" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data.get('artifacts', []):
              if a['name'] == '$name':
                  print(a['id'])
                  break
          "
          }

          BASE="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"

          for VAR in installer windows webgl; do
            case $VAR in
              installer) NAME="${{ inputs.installer-artifact-name }}" ;;
              windows)   NAME="${{ inputs.windows-artifact-name }}" ;;
              webgl)     NAME="${{ inputs.webgl-artifact-name }}" ;;
            esac

            if [ -n "$NAME" ]; then
              ID=$(get_id "$NAME")
              if [ -n "$ID" ]; then
                echo "${VAR}_url=${BASE}/${ID}" >> $GITHUB_OUTPUT
                echo "${VAR} artifact ID: $ID"
              else
                echo "${VAR}_url=" >> $GITHUB_OUTPUT
                echo "${VAR} artifact が見つかりませんでした (name: $NAME)"
              fi
            else
              echo "${VAR}_url=" >> $GITHUB_OUTPUT
            fi
          done

      - name: Prepare Notification Data
        id: prepare
        if: steps.check.outputs.available == 'true'
        run: |
          case "${{ inputs.status }}" in
            success)
              echo "color=3066993"   >> $GITHUB_OUTPUT
              echo "emoji=✅"        >> $GITHUB_OUTPUT
              echo "title=ビルド成功" >> $GITHUB_OUTPUT
              ;;
            failure)
              echo "color=15158332"  >> $GITHUB_OUTPUT
              echo "emoji=❌"        >> $GITHUB_OUTPUT
              echo "title=ビルド失敗" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "color=15844367"        >> $GITHUB_OUTPUT
              echo "emoji=⚠️"              >> $GITHUB_OUTPUT
              echo "title=ビルドキャンセル" >> $GITHUB_OUTPUT
              ;;
          esac

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "body<<EOF"
            echo "**バージョン:** \`${{ inputs.version }}\`"
            echo "**ジョブ:** ${{ inputs.job-name }}"
            echo "**ブランチ/タグ:** \`${{ github.ref_name }}\`"
            echo "**実行者:** ${{ github.actor }}"
            echo ""

            # 成果物リンク（存在するものだけ表示）
            HAS_LINK=false

            if [ -n "${{ inputs.installer-artifact-name }}" ]; then
              echo "[インストーラー (EXE)](${ARTIFACTS_URL})"
              HAS_LINK=true
            fi
            if [ -n "${{ inputs.windows-artifact-name }}" ]; then
              echo "[Windows ビルド](${ARTIFACTS_URL})"
              HAS_LINK=true
            fi
            if [ -n "${{ inputs.webgl-artifact-name }}" ]; then
              echo "[WebGL ビルド](${ARTIFACTS_URL})"
              HAS_LINK=true
            fi
            if [ -n "${{ inputs.pages-url }}" ]; then
              echo "[GitHub Pages でプレイ](${{ inputs.pages-url }})"
              HAS_LINK=true
            fi

            echo ""
            echo "📋 [Actions ログを確認](${RUN_URL})"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        if: steps.check.outputs.available == 'true'
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url:       ${{ secrets.DISCORD_WEBHOOK_URL }}
          username:          "GitHub Actions"
          avatar-url:        "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          embed-title:       "${{ steps.prepare.outputs.emoji }} ${{ steps.prepare.outputs.title }}: ${{ inputs.workflow-name }}"
          embed-color:       ${{ steps.prepare.outputs.color }}
          embed-url:         "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          embed-description: ${{ steps.prepare.outputs.body }}
