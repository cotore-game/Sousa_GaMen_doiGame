name: Discord Notification

on:
  workflow_call:
    inputs:
      status:
        description: 'Build status (success / failure / cancelled)'
        required: true
        type: string
      version:
        description: 'Build version'
        required: true
        type: string
      workflow-name:
        description: 'Workflow name'
        required: true
        type: string
      job-name:
        description: 'Job name that triggered notification'
        required: false
        type: string
        default: 'Build'
      installer-artifact-name:
        description: 'インストーラーアーティファクト名 (省略可)'
        required: false
        type: string
        default: ''
      windows-artifact-name:
        description: 'Windows ビルドアーティファクト名 (省略可)'
        required: false
        type: string
        default: ''
      webgl-artifact-name:
        description: 'WebGL ビルドアーティファクト名 (省略可)'
        required: false
        type: string
        default: ''
      pages-url:
        description: 'デプロイされた GitHub Pages の URL (省略可)'
        required: false
        type: string
        default: ''
    secrets:
      DISCORD_WEBHOOK_URL:
        # オプション：未設定の場合は通知をスキップする（エラーにしない）
        required: false

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest

    # secrets は if 条件で直接参照できないため env 経由で空チェックを行う
    env:
      WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check Webhook Availability
        id: check
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "ℹDISCORD_WEBHOOK_URL が未設定のため通知をスキップします"
          fi

      - name: Prepare Notification Data
        id: prepare
        if: steps.check.outputs.available == 'true'
        run: |
          case "${{ inputs.status }}" in
            success)
              echo "color=3066993"   >> $GITHUB_OUTPUT
              echo "emoji=✅"        >> $GITHUB_OUTPUT
              echo "title=ビルド成功" >> $GITHUB_OUTPUT
              ;;
            failure)
              echo "color=15158332"  >> $GITHUB_OUTPUT
              echo "emoji=❌"        >> $GITHUB_OUTPUT
              echo "title=ビルド失敗" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "color=15844367"        >> $GITHUB_OUTPUT
              echo "emoji=⚠️"              >> $GITHUB_OUTPUT
              echo "title=ビルドキャンセル" >> $GITHUB_OUTPUT
              ;;
          esac

          # ─── 成果物リンクを組み立て ───────────────────────────────────
          # GitHub Actions の成果物 URL:
          #   https://github.com/<owner>/<repo>/actions/runs/<run_id>/artifacts
          # 個別アーティファクトへの直リンクは公開 API 経由でないと取れないため
          # run の artifacts ページへのリンクを生成する。
          BASE_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ARTIFACTS_URL="${BASE_URL}/artifacts"

          LINKS=""

          # インストーラーアーティファクト
          if [ -n "${{ inputs.installer-artifact-name }}" ]; then
            LINKS="${LINKS}[インストーラー (EXE)](${ARTIFACTS_URL})\n"
          fi

          # Windows ZIPアーティファクト
          if [ -n "${{ inputs.windows-artifact-name }}" ]; then
            LINKS="${LINKS}[Windows ビルド (ZIP)](${ARTIFACTS_URL})\n"
          fi

          # WebGL アーティファクト
          if [ -n "${{ inputs.webgl-artifact-name }}" ]; then
            LINKS="${LINKS}[WebGL ビルド](${ARTIFACTS_URL})\n"
          fi

          # GitHub Pages
          if [ -n "${{ inputs.pages-url }}" ]; then
            LINKS="${LINKS}[GitHub Pages でプレイ](${{ inputs.pages-url }})\n"
          fi

          if [ -z "$LINKS" ]; then
            LINKS="（成果物なし）"
          fi

          # 改行をエスケープして output に渡す（Discord embed は \n を改行として解釈）
          # GitHub Actions の output は複数行を EOF 形式で渡す
          {
            echo "links<<EOF"
            printf "${LINKS}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Send Discord Notification
        if: steps.check.outputs.available == 'true'
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url:       ${{ secrets.DISCORD_WEBHOOK_URL }}
          username:          "GitHub Actions"
          avatar-url:        "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          embed-title:       "${{ steps.prepare.outputs.emoji }} ${{ steps.prepare.outputs.title }}: ${{ inputs.workflow-name }}"
          embed-color:       ${{ steps.prepare.outputs.color }}
          embed-url:         "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          embed-description: |
            **バージョン:** `${{ inputs.version }}`
            **ステータス:** ${{ inputs.status }}
            **ジョブ:** ${{ inputs.job-name }}
          embed-fields: |
            [
              {
                "name": "📦 リポジトリ",
                "value": "[${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})",
                "inline": true
              },
              {
                "name": "🔀 ブランチ/タグ",
                "value": "`${{ github.ref_name }}`",
                "inline": true
              },
              {
                "name": "👤 実行者",
                "value": "${{ github.actor }}",
                "inline": true
              },
              {
                "name": "🔗 ダウンロード・リンク",
                "value": "${{ steps.prepare.outputs.links }}",
                "inline": false
              },
              {
                "name": "📋 ワークフロー詳細",
                "value": "[Actions ログを確認](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                "inline": false
              }
            ]
