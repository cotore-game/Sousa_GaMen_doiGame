name: Deploy WebGL to GitHub Pages

on:
  workflow_call:
    inputs:
      version:
        description: 'ビルドバージョン (ログ用、省略可)'
        required: false
        type: string
        default: ''
      unity-artifact-name:
        description: 'ダウンロードするUnityビルドアーティファクト名'
        required: true
        type: string

jobs:
  deploy-webgl:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    # ─────────────────────────────────────────────────────────
    # 【修正ポイント】
    # この権限は呼び出し元 (release.yml) の最上位 permissions で
    # pages: write / id-token: write が付与されている必要がある。
    # ─────────────────────────────────────────────────────────
    permissions:
      pages:    write
      id-token: write

    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Unity Build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.unity-artifact-name }}
          path: build/WebGL

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
