name: Deploy WebGL to GitHub Pages

on:
  workflow_call:
    inputs:
      version:
        description: 'ビルドバージョン (ログ用、省略可)'
        required: false
        type: string
        default: ''
      unity-artifact-name:
        description: 'ダウンロードするUnityビルドアーティファクト名'
        required: true
        type: string

jobs:
  deploy-webgl:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      pages:    write
      id-token: write

    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Unity Build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.unity-artifact-name }}
          path: build/WebGL
      - name: Locate WebGL Build Root
        id: locate
        run: |
          # index.html があるディレクトリを探す（BuildName が変わっても追従）
          INDEX=$(find build/WebGL -name "index.html" | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "index.html が見つかりません"
            find build/WebGL -type f | head -30
            exit 1
          fi
          BUILD_ROOT=$(dirname "$INDEX")
          echo "build_root=${BUILD_ROOT}" >> $GITHUB_OUTPUT
          echo "WebGL ビルドルート: ${BUILD_ROOT}"

      - name: Move WebGL Root to pages-root
        run: |
          mv "${{ steps.locate.outputs.build_root }}" pages-root
          echo "pages-root の内容:"
          ls -lh pages-root/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
