# GitHub Pages OGP & Meta Tags Configuration
# Expected location: .github/index/meta.yml

# Set to false to disable OGP injection entirely
enabled: true

# Page title (og:title / twitter:title)
title: "操作がめんどいゲーム"

# Page description (description / og:description / twitter:description)
description: "ひねくれまくった問題作がゲームジャムに登場！\n果たして君はこのめんどくささに耐えられるか！"

# Toggle icon and OGP image embedding
icon: true

# Target image filename located in the same directory (.github/index/)
icon_file: "icon.png"

# Browser theme color
# theme_color: "#1a1a2e"
